<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>Greyhound Track Guide</title>
  <link rel="stylesheet" href="styles.css?v=20260815b">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TG</div>
      <div>
        <p class="eyebrow">Race-day reference</p>
        <h1>Greyhound Track Guide</h1>
      </div>
    </div>
    <div class="header-actions">
      <div class="summary" id="summary">Loading tracks...</div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="true">
        <span>Light</span>
        <span class="toggle-track" aria-hidden="true"><span></span></span>
        <span>Dark</span>
      </button>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Track filters">
      <div class="country-tabs" id="countryTabs"></div>
      <label class="search">
        <span>Search tracks</span>
        <input id="searchInput" type="search" placeholder="Name, distance, rule..." autocomplete="off">
      </label>
      <label class="select">
        <span>Strategy</span>
        <select id="strategyFilter">
          <option value="all">All strategies</option>
        </select>
      </label>
      <label class="select">
        <span>Sort by</span>
        <select id="sortSelect">
          <option value="country">Country &amp; track</option>
          <option value="rate">Favourite win rate</option>
          <option value="sample">Sample size</option>
          <option value="track">Track name</option>
        </select>
      </label>
      <button class="starred-filter" id="starredFilter" type="button" aria-pressed="false">
        <span aria-hidden="true">&#9733;</span> Starred
      </button>
    </section>

    <details class="legend-panel">
      <summary>Strategy &amp; data guide</summary>
      <div class="legend" id="legend"></div>
    </details>

    <section class="results-head" aria-live="polite">
      <p id="resultCount">Tracks</p>
      <div class="results-actions">
        <p>Tap the star to build a race-day shortlist.</p>
        <div class="view-toggle" id="viewToggle" role="group" aria-label="Result view">
          <button type="button" data-view="cards" aria-pressed="true">Cards</button>
          <button type="button" data-view="table" aria-pressed="false">Table</button>
        </div>
      </div>
    </section>

    <section class="track-grid" id="trackGrid" aria-live="polite"></section>
    <div class="track-table-wrap" id="trackTableWrap" hidden>
      <table class="track-table">
        <caption class="sr-only">Track statistics comparison</caption>
        <thead>
          <tr>
            <th scope="col">Track</th>
            <th scope="col">Confidence</th>
            <th scope="col">Fav win</th>
            <th scope="col">Sample</th>
            <th scope="col">Draw metric</th>
            <th scope="col">Strongest distance</th>
            <th scope="col">Source</th>
            <th scope="col"><span class="sr-only">Shortlist</span></th>
          </tr>
        </thead>
        <tbody id="trackTableBody"></tbody>
      </table>
    </div>
  </main>

  <template id="trackTemplate">
    <article class="track-card">
      <div class="card-head">
        <div>
          <div class="card-labels">
            <span class="country"></span>
            <span class="strategy"></span>
          </div>
          <h2></h2>
        </div>
        <button class="star" type="button" aria-label="Add track to shortlist" title="Add to shortlist">&#9734;</button>
      </div>
      <p class="headline"></p>
      <div class="card-meta"></div>
      <div class="metrics"></div>
      <div class="rule"></div>
      <div class="distances"></div>
      <details class="personal-note">
        <summary>Personal note</summary>
        <textarea rows="3" aria-label="Personal track note" placeholder="Add a race-day note..."></textarea>
      </details>
    </article>
  </template>

  <script src="app.js?v=20260815b"></script>
</body>
</html>
